{% extends "base.html" %}

{% block title %}Create Account - E-Commerce Demo{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card user-card" style="max-width: 480px;">
        <div class="auth-header">
            <div class="auth-badge-wrapper">
                <span class="auth-badge user">
                    <span class="badge-dot" style="background: #2563eb;"></span> New Customer
                </span>
            </div>

            <div class="auth-icon-wrap user">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
            </div>

            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join E-Commerce Demo to access orders, quick checkout, and track shipments</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input 
                        type="text" 
                        name="full_name" 
                        value="{{ full_name or '' }}" 
                        placeholder="e.g. Shabber Hussain" 
                        required 
                        autocomplete="name"
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span>
                    <input 
                        type="email" 
                        name="email" 
                        value="{{ email or '' }}" 
                        placeholder="shabber12396@gmail.com" 
                        required 
                        autocomplete="email"
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                    </span>
                    <input 
                        type="text" 
                        name="phone" 
                        placeholder="10-digit mobile number" 
                        required 
                        autocomplete="tel"
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password (Min. 6 characters)</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input 
                        type="password" 
                        name="password" 
                        placeholder="Create strong password" 
                        required 
                        minlength="6"
                        autocomplete="new-password"
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                    </span>
                    <input 
                        type="password" 
                        name="confirm_password" 
                        placeholder="Repeat your password" 
                        required 
                        minlength="6"
                        autocomplete="new-password"
                    >
                </div>
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn-auth-primary user-btn">
                    <span>Create Account &rarr;</span>
                </button>
            </div>
        </form>

        <div class="auth-footer">
            <p style="margin: 0 0 10px 0; font-size: 13.5px; color: #64748b;">
                Already have an account? 
                <a href="{{ url_for('login') }}" style="color: #2563eb; font-weight: 700;">
                    Sign In here &rarr;
                </a>
            </p>
            <p style="margin: 0;">
                <a href="{{ url_for('index') }}" class="auth-nav-link">&larr; Return to Catalog</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
