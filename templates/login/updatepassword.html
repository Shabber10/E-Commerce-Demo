{% extends "base.html" %}

{% block title %}Change Password - E-Commerce Demo{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="auth-card user-card">
        <div class="auth-header">
            

            <div class="auth-icon-wrap user">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>

            <h1 class="auth-title">Update Password</h1>
        </div>

        <form action="{{ url_for('updatepassword') }}" method="POST">
            <div class="form-group">
                <label for="update-password" class="form-label">New Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input 
                        type="password" 
                        id="update-password" 
                        name="password" 
                        placeholder="At least 6 characters" 
                        required 
                        minlength="6"
                        autocomplete="new-password"
                        autofocus
                    >
                    <button type="button" class="password-toggle-btn" title="Toggle password visibility" aria-label="Toggle password visibility">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="update-confirm-password" class="form-label">Confirm New Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                    </span>
                    <input 
                        type="password" 
                        id="update-confirm-password" 
                        name="confirm_password" 
                        placeholder="Repeat new password" 
                        required 
                        minlength="6"
                        autocomplete="new-password"
                    >
                    <button type="button" class="password-toggle-btn" title="Toggle password visibility" aria-label="Toggle password visibility">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn-auth-primary user-btn">
                    <span>Save New Password &rarr;</span>
                </button>
            </div>
        </form>

        <div class="auth-footer">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('dashboard') }}" class="auth-nav-link">&larr; Back to Dashboard</a>
            {% else %}
                <a href="{{ url_for('login') }}" class="auth-nav-link">&larr; Back to Sign In</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
