{% extends "base.html" %}

{% block title %}Reset Password - NovaStore{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Reset Password</h1>
        </div>

        <form action="{{ url_for('forgot_password') }}" method="POST">
            <!-- Email Address -->
            <div class="form-group">
                <label for="reset-email" class="form-label">Registered Email</label>
                <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true">✉️</span>
                    <input 
                        type="email" 
                        id="reset-email" 
                        name="email" 
                        class="form-control" 
                        placeholder="name@example.com" 
                        value="{{ email or '' }}" 
                        required 
                        autocomplete="email"
                    >
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-full">
                Send OTP &rarr;
            </button>
        </form>

        <div class="auth-footer">
            Remembered your credentials? 
            <a href="{{ url_for('login') }}">Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
