{% extends "base.html" %}

{% block title %}Admin Sign In - E-Commerce Demo{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card admin-card">
        <div class="auth-header">
            
            <div class="auth-icon-wrap admin">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </div>

            <h1 class="auth-title">Admin Sign In</h1>
        </div>

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Administrator Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span>
                    <input 
                        type="email" 
                        name="email" 
                        value="{{ email or '' }}" 
                        placeholder="admin@example.com" 
                        required 
                        autocomplete="email"
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input 
                        type="password" 
                        name="password" 
                        placeholder="Enter admin password" 
                        required 
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle-btn" title="Toggle password visibility" aria-label="Toggle password visibility">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn-auth-primary admin-btn">
                    <span>Access Admin Dashboard</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            <div style="background: #fff1f2; border: 1px dashed #fecdd3; border-radius: 8px; padding: 9px 12px; margin-top: 14px; font-size: 12px; color: #9f1239; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <strong>Default Admin:</strong> <span style="font-family: monospace;">shabber10343@gmail.com</span> &bull; <span style="font-family: monospace;">Admin@123</span>
                </div>
                <button type="button" onclick="document.querySelector('input[name=email]').value='shabber10343@gmail.com';document.querySelector('input[name=password]').value='Admin@123';" style="background: #ffe4e6; border: 1px solid #fecdd3; color: #e11d48; font-weight: 600; cursor: pointer; padding: 3px 8px; border-radius: 4px; font-size: 11.5px;">Auto Fill</button>
            </div>
        </form>

        <div class="auth-footer">
            <p style="margin: 0 0 10px 0; font-size: 13px; color: #64748b;">
                Need to register an Admin account? 
                <a href="{{ url_for('admin_register') }}" style="color: #e11d48; font-weight: 700; text-decoration: none;">
                    Admin Sign-Up with OTP &rarr;
                </a>
            </p>
            <div style="display: flex; justify-content: center; gap: 14px; font-size: 13px;">
                <a href="{{ url_for('login') }}" class="auth-nav-link">&larr; Customer Sign In</a>
                <span style="color: #cbd5e1;">&bull;</span>
                <a href="{{ url_for('index') }}" class="auth-nav-link">Store Front</a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
